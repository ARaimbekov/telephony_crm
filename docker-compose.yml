version: "3"
   
services:
  db:
    image: postgres:14-alpine
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "15432:5432"
    restart: always

  web:
    build: .
    command: gunicorn -w 4 --bind 0.0.0.0:8080 djcrm.wsgi
    volumes:
      - .:/code
    ports:
      - "8080:8080"
    restart: always

    environment:
      - POSTGRES_NAME=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      - db

  portal:
    image: nginx:alpine
    container_name: service_portal
    volumes:
      - ./portal:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    restart: always