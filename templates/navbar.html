<header class="bg-white border-b border-gray-200">
  <div class="w-full px-6 py-3 flex items-center justify-between gap-4">

    <!-- LEFT: menu -->
    <nav class="flex flex-wrap items-center gap-6">
      {% if user.is_superuser %}
        <a class="inline-flex px-3 py-2 rounded-lg text-gray-700 font-semibold hover:text-blue-600 hover:bg-blue-50 transition"
          href="{% url 'company' %}">Компании</a>

        <a class="inline-flex px-3 py-2 rounded-lg text-gray-700 font-semibold hover:text-blue-600 hover:bg-blue-50 transition"
          href="{% url 'apparats' %}">Модели телефонов</a>

        <a class="inline-flex px-3 py-2 rounded-lg text-gray-700 font-semibold hover:text-blue-600 hover:bg-blue-50 transition"
          href="{% url 'number' %}">Нумерация</a>

        <a class="inline-flex px-3 py-2 rounded-lg text-gray-700 font-semibold hover:text-blue-600 hover:bg-blue-50 transition"
          href="{% url 'atc' %}">ATC</a>

        <a class="inline-flex px-3 py-2 rounded-lg text-gray-700 font-semibold hover:text-blue-600 hover:bg-blue-50 transition"
          href="{% url 'leads:lead-list' %}">Телефоны (MAC)</a>

        <a class="inline-flex px-3 py-2 rounded-lg text-gray-700 font-semibold hover:text-blue-600 hover:bg-blue-50 transition"
          href="{% url 'leads:users' %}">Контроль пользователей</a>
      {% endif %}
    </nav>

    <!-- RIGHT: user -->
    {% if request.user.is_authenticated %}
      <div class="flex items-center gap-8 whitespace-nowrap">
        <div class="text-sm text-gray-600">
          Вы вошли как: &nbsp;&nbsp;<span class="font-semibold text-gray-900">{{ request.user.username }} &nbsp;&nbsp; </span>
        </div>

        <a href="{% url 'logout' %}"
           class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-bold
                  bg-red-500 text-white hover:bg-red-600 transition">
          Выйти
          <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
               stroke-width="2" class="w-4 h-4" viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </a>
      </div>
    {% endif %}

  </div>
</header>
